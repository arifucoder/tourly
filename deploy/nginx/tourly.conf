# Host nginx for Tourly. Copy to /etc/nginx/sites-available/tourly, replace tourly.dev.cv,
# then: ln -s /etc/nginx/sites-available/tourly /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Cloudflare: DNS record proxied (orange cloud), SSL/TLS mode "Full (strict)".

server {
	listen 80;
	listen [::]:80;
	server_name tourly.dev.cv;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name tourly.dev.cv;

	ssl_certificate     /etc/ssl/cloudflare/tourly.pem;
	ssl_certificate_key /etc/ssl/cloudflare/tourly.key;

	# tour images (multer) go through here
	client_max_body_size 20m;

	location /api/ {
		proxy_pass http://127.0.0.1:5200;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 60s;
	}

	location / {
		proxy_pass http://127.0.0.1:3200;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
