name: tourly

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - backend
    # only reachable from this machine (lets `pnpm dev` outside Docker use it too)
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: ./server
    image: tourly-api
    env_file: ./server/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ""
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PORT: 5000
    ports:
      - "${API_PORT:-5000}:5000"
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./client
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-http://localhost:5000/api/v1}
    image: tourly-web
    ports:
      - "${WEB_PORT:-5173}:8080"
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  # api ↔ redis only; web (static nginx) can't reach Redis
  backend:
    name: tourly-backend
  # web is served to the browser on its own network
  frontend:
    name: tourly-frontend

volumes:
  redis-data:
