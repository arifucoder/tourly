name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel a deploy halfway

permissions:
  contents: read
  packages: write # push to GHCR

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: api
            context: server
          - app: web
            context: client
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # same-origin: nginx sends /api to the api container, so the client calls a relative URL
          build-args: |
            VITE_BASE_URL=/api/v1
          tags: |
            ghcr.io/arifucoder/tourly-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/arifucoder/tourly-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      # keep the VPS copy of compose + scripts in sync with the repo
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/deploy.sh,deploy/backup.sh"
          target: "~/apps/tourly"
          strip_components: 1
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/apps/tourly
            chmod +x deploy.sh backup.sh
            IMAGE_TAG=${{ github.sha }} ./deploy.sh
